    # BEGIN MANAGED MOCKTC
    server {
        listen 80;
        server_name mocktc.bjlzc.cn;
        location /.well-known/acme-challenge/ { root /opt/bjlzc-agent-public-router/acme-challenges; }
        location / { return 302 https://mocktc.bjlzc.cn$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name mocktc.bjlzc.cn;
        ssl_certificate "/opt/bjlzc-agent-public-router/certs/mocktc.bjlzc.cn/fullchain.pem";
        ssl_certificate_key "/opt/bjlzc-agent-public-router/certs/mocktc.bjlzc.cn/privkey.pem";
        limit_conn bjlzc_per_ip 30;
        client_max_body_size 10m;
        location / {
            proxy_pass http://127.0.0.1:18120;
            proxy_http_version 1.1;
            proxy_set_header Host mocktc.bjlzc.cn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host mocktc.bjlzc.cn;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_connect_timeout 10s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
    # END MANAGED MOCKTC
